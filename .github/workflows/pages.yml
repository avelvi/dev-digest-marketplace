name: pages

# Builds the catalog site from the repository contents. Pull requests run the same
# steps without deploying, so a broken plugin file fails the PR instead of the deploy.
# No path filters: the catalog depends on plugins/ and .claude-plugin/ as well as site/.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Validate marketplace structure
        run: node scripts/validate-marketplace.mjs --strict

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build catalog
        working-directory: site
        run: npm run catalog

      - name: Typecheck
        working-directory: site
        run: npm run typecheck

      - name: Lint
        working-directory: site
        run: npm run lint

      - name: Test
        working-directory: site
        run: npm test

      - name: Build site
        working-directory: site
        run: npx vite build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
